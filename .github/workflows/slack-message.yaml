name: Submit a slack notification
on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      message:
        required: true
        type: string
      repository:
        required: true
        type: string
      button:
        required: false
        type: string
    secrets:
      webhook_url:
        required: true
jobs:
  notify:
    name: Send slack notification
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Build message
        env:
          # Passed through the environment rather than interpolated into the
          # script, so quotes, backticks and $(...) in a message can neither
          # break the shell nor inject commands.
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
          REPOSITORY: ${{ inputs.repository }}
          BUTTON: ${{ inputs.button }}
        run: |
          set -euo pipefail

          # Slack mrkdwn requires exactly these three characters to be escaped.
          # JSON string escaping is jq's job, so it is not handled here.
          escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          REPO_URL="https://github.com/$REPOSITORY"
          RUN_URL="$REPO_URL/actions/runs/$GITHUB_RUN_ID"

          # Quote the message instead of turning each line into a link label:
          # link labels cannot contain <, > or |, which is what broke messages
          # before. The run is linked from the button and the context.
          if [ -n "${MESSAGE//[[:space:]]/}" ]; then
            BODY=$(printf '%s\n' "$MESSAGE" | escape | sed 's/^/>/')
          else
            BODY=""
          fi

          CONTEXT="<$REPO_URL|$(printf '%s' "$REPOSITORY" | escape)>"
          CONTEXT="$CONTEXT  •  <https://github.com/$GITHUB_ACTOR|@$GITHUB_ACTOR>"

          jq -n \
            --arg fallback "$TITLE" \
            --arg title "*$(printf '%s' "$TITLE" | escape)*" \
            --arg body "$BODY" \
            --arg context "$CONTEXT" \
            --arg run_url "$RUN_URL" \
            --arg button "${BUTTON:-View progress}" \
            '{
              text: $fallback,
              blocks: (
                [
                  {
                    type: "section",
                    text: { type: "mrkdwn", text: $title },
                    accessory: {
                      type: "button",
                      url: $run_url,
                      text: { type: "plain_text", text: $button }
                    }
                  }
                ]
                + (if $body == "" then [] else [
                    { type: "section", text: { type: "mrkdwn", text: $body } }
                  ] end)
                + [
                  { type: "context", elements: [ { type: "mrkdwn", text: $context } ] }
                ]
              )
            }' > payload.json

          echo "Submitting message with payload:"
          cat payload.json
      - name: Send message to slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.webhook_url }}
          webhook-type: incoming-webhook
          payload-file-path: ./payload.json
